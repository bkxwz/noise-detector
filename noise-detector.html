<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>噪音检测器 - 实时分贝监测与语音识别</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0e1a;
  color: #e0e6f0;
  min-height: 100vh;
  overflow-x: hidden;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

header {
  text-align: center;
  padding: 30px 0 20px;
}

header h1 {
  font-size: 2rem;
  font-weight: 700;
  background: linear-gradient(135deg, #00d4ff, #7b2ff7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

header p {
  color: #6b7a99;
  font-size: 0.95rem;
}

.start-btn {
  display: block;
  margin: 25px auto;
  padding: 14px 40px;
  font-size: 1.1rem;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(135deg, #00d4ff, #7b2ff7);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
}

.start-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 30px rgba(0, 212, 255, 0.5);
}

.start-btn:active { transform: translateY(0); }
.start-btn.hidden { display: none; }

.main-display {
  display: none;
  text-align: center;
  padding: 20px 0;
}
.main-display.active { display: block; }

.gauge-container {
  position: relative;
  width: 280px;
  height: 280px;
  margin: 0 auto 20px;
}

.gauge-bg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, #1a2035 0%, #0f1525 100%);
  box-shadow: 0 0 60px rgba(0, 212, 255, 0.1), inset 0 0 40px rgba(0, 0, 0, 0.5);
}

.gauge-ring {
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: 3px solid #1e2740;
}

.gauge-progress {
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: #00d4ff;
  border-right-color: #00d4ff;
  transform: rotate(-45deg);
  transition: border-color 0.3s;
}

.db-value {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.db-value .number {
  font-size: 4.5rem;
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(135deg, #00d4ff, #7b2ff7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  transition: background 0.3s;
}

.db-value .unit {
  font-size: 1.2rem;
  color: #6b7a99;
  margin-top: 4px;
}

.db-value .label {
  font-size: 0.9rem;
  color: #8b97b0;
  margin-top: 8px;
  padding: 4px 12px;
  border-radius: 20px;
  display: inline-block;
}

.stats-row {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 20px 0 30px;
}

.stat-item { text-align: center; }

.stat-item .stat-label {
  font-size: 0.8rem;
  color: #6b7a99;
  margin-bottom: 4px;
}

.stat-item .stat-value {
  font-size: 1.3rem;
  font-weight: 700;
  color: #c0c8e0;
}

.level-bar-container {
  margin: 0 auto 30px;
  max-width: 500px;
}

.level-bar {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(90deg, #00e676 0%, #ffeb3b 35%, #ff9800 60%, #f44336 80%, #9c27b0 100%);
  position: relative;
  overflow: visible;
}

.level-indicator {
  position: absolute;
  top: -8px;
  width: 4px;
  height: 28px;
  background: #fff;
  border-radius: 2px;
  transform: translateX(-50%);
  transition: left 0.15s ease-out;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

.level-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 0.75rem;
  color: #6b7a99;
}

.guide-section {
  display: none;
  margin-top: 30px;
}
.guide-section.active { display: block; }

.guide-card {
  background: linear-gradient(135deg, #141b2d 0%, #1a2238 100%);
  border: 1px solid #253050;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}

.guide-card h3 {
  font-size: 1.1rem;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.guide-card .status-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.guide-card ul { list-style: none; padding: 0; }

.guide-card li {
  padding: 8px 0;
  border-bottom: 1px solid #1e2740;
  font-size: 0.9rem;
  line-height: 1.5;
  color: #a0aac0;
}

.guide-card li:last-child { border-bottom: none; }
.guide-card li strong { color: #e0e6f0; }

.safe-time-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.safe-time-item {
  background: #0f1525;
  border-radius: 10px;
  padding: 12px;
  text-align: center;
  border: 1px solid #1e2740;
}

.safe-time-item .db {
  font-size: 1.1rem;
  font-weight: 700;
}

.safe-time-item .time {
  font-size: 0.8rem;
  color: #6b7a99;
  margin-top: 4px;
}

.safe-time-item.current {
  border-color: #00d4ff;
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
}

.waveform-canvas {
  width: 100%;
  height: 60px;
  margin: 15px 0;
  border-radius: 10px;
  background: #0f1525;
}

/* Voice recognition section */
.voice-section {
  margin-top: 30px;
}

.voice-card {
  background: linear-gradient(135deg, #141b2d 0%, #1a2238 100%);
  border: 1px solid #253050;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}

.voice-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.voice-header h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.1rem;
}

.voice-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  padding: 4px 12px;
  border-radius: 20px;
}

.voice-status.listening {
  background: #00e67622;
  color: #00e676;
}

.voice-status.idle {
  background: #6b7a9922;
  color: #6b7a99;
}

.voice-status.detecting {
  background: #ffeb3b22;
  color: #ffeb3b;
}

.voice-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.voice-status.listening .voice-status-dot {
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.interim-text {
  font-size: 1rem;
  color: #6b7a99;
  padding: 12px;
  background: #0f1525;
  border-radius: 10px;
  margin-bottom: 12px;
  min-height: 44px;
  font-style: italic;
}

.final-text-container {
  max-height: 300px;
  overflow-y: auto;
  padding-right: 8px;
}

.final-text-container::-webkit-scrollbar {
  width: 4px;
}

.final-text-container::-webkit-scrollbar-track {
  background: #1e2740;
  border-radius: 2px;
}

.final-text-container::-webkit-scrollbar-thumb {
  background: #3a4a70;
  border-radius: 2px;
}

.final-item {
  padding: 10px 14px;
  background: #0f1525;
  border-radius: 8px;
  margin-bottom: 8px;
  border-left: 3px solid #00d4ff;
  text-align: left;
}

.final-item .final-time {
  font-size: 0.75rem;
  color: #4a5570;
  margin-bottom: 4px;
}

.final-item .final-content {
  font-size: 0.95rem;
  color: #e0e6f0;
  line-height: 1.5;
}

.voice-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 20px;
  color: #6b7a99;
  font-size: 0.9rem;
}

.voice-loading .spinner {
  width: 20px;
  height: 20px;
  border: 2px solid #1e2740;
  border-top-color: #00d4ff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.voice-not-supported {
  padding: 20px;
  text-align: center;
  color: #f44336;
  background: #f4433611;
  border-radius: 10px;
  font-size: 0.9rem;
}

footer {
  text-align: center;
  padding: 30px 0;
  color: #4a5570;
  font-size: 0.8rem;
}

@media (max-width: 600px) {
  header h1 { font-size: 1.5rem; }
  .gauge-container { width: 220px; height: 220px; }
  .db-value .number { font-size: 3.5rem; }
  .stats-row { gap: 15px; }
  .safe-time-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>噪音检测器</h1>
    <p>实时监测环境噪音分贝 | 人声检测与语音转文字</p>
  </header>

  <button class="start-btn" id="startBtn">开始检测</button>

  <div class="main-display" id="mainDisplay">
    <div class="gauge-container">
      <div class="gauge-bg"></div>
      <div class="gauge-ring"></div>
      <div class="gauge-progress" id="gaugeProgress"></div>
      <div class="db-value">
        <div class="number" id="dbNumber">--</div>
        <div class="unit">dB(A)</div>
        <div class="label" id="levelLabel">等待检测...</div>
      </div>
    </div>

    <canvas class="waveform-canvas" id="waveformCanvas"></canvas>

    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-label">最低</div>
        <div class="stat-value" id="minDb">--</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">平均</div>
        <div class="stat-value" id="avgDb">--</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">最高</div>
        <div class="stat-value" id="maxDb">--</div>
      </div>
    </div>

    <div class="level-bar-container">
      <div class="level-bar">
        <div class="level-indicator" id="levelIndicator" style="left: 0%"></div>
      </div>
      <div class="level-labels">
        <span>30dB 安静</span>
        <span>60dB 一般</span>
        <span>85dB 危险</span>
        <span>120dB 极危</span>
      </div>
    </div>

    <div class="guide-section active" id="guideSection">
      <div class="guide-card" id="guideCard">
        <h3><span class="status-icon" id="statusIcon"></span><span id="guideTitle">防护指南</span></h3>
        <ul id="guideList"></ul>
      </div>

      <div class="guide-card">
        <h3>安全暴露时间 (WHO 标准)</h3>
        <div class="safe-time-grid" id="safeTimeGrid"></div>
      </div>

      <div class="guide-card">
        <h3>常见噪音参考</h3>
        <ul id="referenceList"></ul>
      </div>
    </div>

    <div class="voice-section">
      <div class="voice-card">
        <div class="voice-header">
          <h3>语音识别</h3>
          <div class="voice-status idle" id="voiceStatus">
            <span class="voice-status-dot"></span>
            <span id="voiceStatusText">初始化中...</span>
          </div>
        </div>

        <div id="voiceContent">
          <div class="voice-loading">
            <div class="spinner"></div>
            <span>正在加载语音识别模型...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    数据基于 WHO / NIOSH / OSHA 国际标准 | 浏览器麦克风检测仅供参考
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/bundle.min.js"></script>
<script>
const SAFE_TIME_TABLE = [
  { db: 30, time: '无限', example: '耳语' },
  { db: 40, time: '无限', example: '图书馆' },
  { db: 50, time: '无限', example: '安静办公室' },
  { db: 60, time: '无限', example: '正常交谈' },
  { db: 70, time: '无限', example: '吸尘器' },
  { db: 80, time: '40 小时', example: '门铃' },

  { db: 90, time: '4 小时', example: '大声喊叫' },

const REFERENCE_SOUNDS = [
  { db: '10 dB', sound: '正常呼吸' },
  { db: '30 dB', sound: '轻声耳语' },
  { db: '40 dB', sound: '图书馆' },
  { db: '60 dB', sound: '正常交谈' },
  { db: '80 dB', sound: '门铃 / 闹钟' },
  { db: '85 dB', sound: '繁忙交通 (车内)' },
  { db: '90 dB', sound: '大声喊叫' },
  { db: '95 dB', sound: '摩托车' },
  { db: '100 dB', sound: '吹风机' },
  { db: '110 dB', sound: '耳边大喊' },
  { db: '120 dB', sound: '站在警报器旁' },
  { db: '130 dB', sound: '风钻' },
  { db: '140 dB', sound: '飞机起飞' },
  { db: '150 dB', sound: '烟花爆竹' },
];

const LEVELS = [
  { min: 0, max: 30, label: '极安静', color: '#00e676', icon: '🌙',
    guides: ['环境非常安静，适合休息和睡眠', '无需任何防护措施', '注意：长期处于过于安静的环境可能产生耳鸣错觉'] },
  { min: 30, max: 50, label: '安静', color: '#4caf50', icon: '🍃',
    guides: ['环境安静舒适，适合工作和学习', '无需防护措施', 'WHO 建议夜间室内噪音低于 40dB'] },
  { min: 50, max: 70, label: '一般', color: '#ffeb3b', icon: '💬',
    guides: ['正常生活噪音范围', '不影响健康，无需防护', '如持续超过 65dB 可能影响注意力集中', '建议办公室环境保持在 55dB 以下'] },
  { min: 70, max: 85, label: '较吵', color: '#ff9800', icon: '⚠️',
    guides: ['噪音开始影响舒适度', 'WHO 建议日间室外噪音不超过 70dB', '长时间暴露可能导致轻微听力疲劳', '建议使用降噪耳机或耳塞降低噪音', '注意减少暴露时间，定时到安静处休息'] },
  { min: 85, max: 100, label: '危险', color: '#f44336', icon: '🔴',
    guides: ['听力损伤风险区域！', 'NIOSH 标准：85dB 以上必须佩戴听力防护装备', '立即佩戴耳塞或降噪耳罩', '每增加 3dB，安全暴露时间减半', '远离噪音源，减少暴露时间', '如必须在此环境工作，请定期做听力检查'] },
  { min: 100, max: 120, label: '极危险', color: '#d32f2f', icon: '☠️',
    guides: ['极度危险！短时间内即可造成永久性听力损伤', '必须佩戴专业听力防护装备 (NRR 25dB+)', '立即远离噪音源', '暴露时间不应超过 15 分钟', '120dB 以上可在数秒内造成不可逆损伤', '如出现耳鸣、听力下降，请立即就医'] },
  { min: 120, max: 200, label: '致聋', color: '#9c27b0', icon: '💀',
    guides: ['致命噪音级别！', '可立即造成永久性听力丧失', '必须使用双重防护 (耳塞 + 耳罩)', '绝对不要在此环境中停留', '140dB 以上可导致鼓膜破裂', '请立即撤离到安全区域！'] },
];

let audioContext, analyser, microphone, dataArray;
let animationId;
let minDb = Infinity, maxDb = -Infinity, totalDb = 0, count = 0;
let currentDb = 0;

const startBtn = document.getElementById('startBtn');
const mainDisplay = document.getElementById('mainDisplay');
const dbNumber = document.getElementById('dbNumber');
const levelLabel = document.getElementById('levelLabel');
const gaugeProgress = document.getElementById('gaugeProgress');
const levelIndicator = document.getElementById('levelIndicator');
const minDbEl = document.getElementById('minDb');
const maxDbEl = document.getElementById('maxDb');
const avgDbEl = document.getElementById('avgDb');
const guideCard = document.getElementById('guideCard');
const statusIcon = document.getElementById('statusIcon');
const guideTitle = document.getElementById('guideTitle');
const guideList = document.getElementById('guideList');
const safeTimeGrid = document.getElementById('safeTimeGrid');
const referenceList = document.getElementById('referenceList');
const waveformCanvas = document.getElementById('waveformCanvas');
const ctx = waveformCanvas.getContext('2d');

const voiceStatus = document.getElementById('voiceStatus');
const voiceStatusText = document.getElementById('voiceStatusText');
const voiceContent = document.getElementById('voiceContent');

let vadInstance = null;
let recognition = null;
let isRecognizing = false;
let isVadReady = false;
let finalTranscripts = [];

startBtn.addEventListener('click', startDetection);

function setVoiceStatus(status, text) {
  voiceStatus.className = 'voice-status ' + status;
  voiceStatusText.textContent = text;
}

function initVoiceRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    voiceContent.innerHTML = '<div class="voice-not-supported">您的浏览器不支持语音识别功能，请使用 Chrome 或 Edge 浏览器。</div>';
    setVoiceStatus('idle', '不支持');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'zh-CN';
  recognition.maxAlternatives = 1;

  let interimTranscript = '';

  recognition.onresult = function(event) {
    interimTranscript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        addFinalTranscript(transcript);
      } else {
        interimTranscript += transcript;
      }
    }
    updateInterimDisplay(interimTranscript);
  };

  recognition.onerror = function(event) {
    if (event.error !== 'no-speech') {
      console.log('Speech recognition error:', event.error);
    }
  };

  recognition.onend = function() {
    isRecognizing = false;
    if (isVadReady) {
      setVoiceStatus('detecting', '等待人声...');
    }
  };

  voiceContent.innerHTML =
    '<div class="interim-text" id="interimText">等待人声出现...</div>' +
    '<div class="final-text-container" id="finalTextContainer"></div>';

  setVoiceStatus('idle', '就绪');
}

function addFinalTranscript(text) {
  if (!text.trim()) return;
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
    now.getMinutes().toString().padStart(2, '0') + ':' +
    now.getSeconds().toString().padStart(2, '0');

  finalTranscripts.push({ text: text.trim(), time: timeStr });

  const container = document.getElementById('finalTextContainer');
  if (container) {
    const item = document.createElement('div');
    item.className = 'final-item';
    item.innerHTML = '<div class="final-time">' + timeStr + '</div>' +
      '<div class="final-content">' + escapeHtml(text.trim()) + '</div>';
    container.appendChild(item);
    container.scrollTop = container.scrollHeight;
  }
}

function updateInterimDisplay(text) {
  const el = document.getElementById('interimText');
  if (el) {
    el.textContent = text || '等待人声出现...';
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function startRecognition() {
  if (recognition && !isRecognizing) {
    try {
      recognition.start();
      isRecognizing = true;
      setVoiceStatus('listening', '识别中...');
    } catch (e) {
      console.log('Recognition start error:', e);
    }
  }
}

function stopRecognition() {
  if (recognition && isRecognizing) {
    recognition.stop();
    isRecognizing = false;
  }
}

async function initVAD() {
  try {
    if (typeof vad === 'undefined') {
      console.log('VAD library not loaded');
      setVoiceStatus('idle', 'VAD 未加载');
      return;
    }

    vadInstance = await vad.MicVAD.new({
      onSpeechStart: () => {
        startRecognition();
      },
      onSpeechEnd: () => {
        setTimeout(() => {
          if (!isRecognizing) return;
          stopRecognition();
        }, 1500);
      },
      onVADMisfire: () => {
      },
      onnxWASMBasePath: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',
      baseAssetPath: 'https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/',
    });

    isVadReady = true;
    vadInstance.start();
    setVoiceStatus('detecting', '等待人声...');
  } catch (e) {
    console.log('VAD init error:', e);
    setVoiceStatus('idle', 'VAD 初始化失败');
  }
}

function startDetection() {
  startBtn.classList.add('hidden');
  mainDisplay.classList.add('active');

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.8;

      microphone = audioContext.createMediaStreamSource(stream);
      microphone.connect(analyser);

      dataArray = new Uint8Array(analyser.frequencyBinCount);
      resizeCanvas();
      update();

      initVoiceRecognition();
      initVAD();
    })
    .catch(err => {
      alert('无法访问麦克风，请确保已授权麦克风权限。\n错误: ' + err.message);
      startBtn.classList.remove('hidden');
      mainDisplay.classList.remove('active');
    });
}

function calculateDb() {
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    sum += dataArray[i];
  }
  const rms = sum / dataArray.length;
  const dbfs = 20 * Math.log10(Math.max(rms, 1) / 255);
  const estimatedSPL = Math.max(30, Math.min(130, Math.round(100 + dbfs * 1.2)));
  return estimatedSPL;
}

function getLevelInfo(db) {
  for (const level of LEVELS) {
    if (db >= level.min && db < level.max) return level;
  }
  return LEVELS[LEVELS.length - 1];
}

function updateGuide(level) {
  statusIcon.textContent = level.icon;
  statusIcon.style.background = level.color + '33';
  statusIcon.style.color = level.color;
  guideTitle.textContent = level.label + ' - 防护指南';
  guideCard.style.borderColor = level.color + '44';

  guideList.innerHTML = '';
  level.guides.forEach(g => {
    const li = document.createElement('li');
    li.textContent = g;
    guideList.appendChild(li);
  });
}

function updateSafeTimeGrid(db) {
  safeTimeGrid.innerHTML = '';
  SAFE_TIME_TABLE.forEach(item => {
    const div = document.createElement('div');
    div.className = 'safe-time-item' + (Math.abs(item.db - db) <= 5 ? ' current' : '');
    div.innerHTML = '<div class="db" style="color: ' + (item.db >= 85 ? '#f44336' : item.db >= 70 ? '#ff9800' : '#4caf50') + '">' + item.db + 'dB</div>' +
      '<div class="time">' + item.time + '</div>' +
      '<div class="time" style="color:#4a5570">' + item.example + '</div>';
    safeTimeGrid.appendChild(div);
  });
}

function updateReferenceList() {
  referenceList.innerHTML = '';
  REFERENCE_SOUNDS.forEach(item => {
    const li = document.createElement('li');
    li.innerHTML = '<strong>' + item.db + '</strong> - ' + item.sound;
    referenceList.appendChild(li);
  });
}

function drawWaveform() {
  const width = waveformCanvas.width;
  const height = waveformCanvas.height;
  ctx.clearRect(0, 0, width, height);

  const timeData = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(timeData);

  ctx.lineWidth = 2;
  const level = getLevelInfo(currentDb);
  ctx.strokeStyle = level.color;
  ctx.beginPath();

  const sliceWidth = width / timeData.length;
  let x = 0;
  for (let i = 0; i < timeData.length; i++) {
    const v = timeData[i] / 128.0;
    const y = (v * height) / 2;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceWidth;
  }
  ctx.stroke();
}

function resizeCanvas() {
  waveformCanvas.width = waveformCanvas.offsetWidth * window.devicePixelRatio;
  waveformCanvas.height = waveformCanvas.offsetHeight * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

window.addEventListener('resize', () => {
  if (analyser) resizeCanvas();
});

function update() {
  animationId = requestAnimationFrame(update);

  const db = calculateDb();
  currentDb = db;

  if (db < minDb) minDb = db;
  if (db > maxDb) maxDb = db;
  totalDb += db;
  count++;

  const avg = Math.round(totalDb / count);
  const level = getLevelInfo(db);

  dbNumber.textContent = db;
  dbNumber.style.background = 'linear-gradient(135deg, ' + level.color + ', ' + level.color + '88)';
  dbNumber.style.webkitBackgroundClip = 'text';
  dbNumber.style.backgroundClip = 'text';

  levelLabel.textContent = level.icon + ' ' + level.label;
  levelLabel.style.background = level.color + '22';
  levelLabel.style.color = level.color;

  const percent = Math.min(100, Math.max(0, ((db - 30) / 90) * 100));
  levelIndicator.style.left = percent + '%';

  const rotation = -135 + (percent / 100) * 270;
  gaugeProgress.style.transform = 'rotate(' + rotation + 'deg)';
  gaugeProgress.style.borderTopColor = level.color;
  gaugeProgress.style.borderRightColor = level.color;

  minDbEl.textContent = minDb + ' dB';
  maxDbEl.textContent = maxDb + ' dB';
  avgDbEl.textContent = avg + ' dB';

  updateGuide(level);
  updateSafeTimeGrid(db);
  drawWaveform();
}

updateReferenceList();
updateSafeTimeGrid(50);
</script>
</body>
</html>
